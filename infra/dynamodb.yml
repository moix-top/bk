AWSTemplateFormatVersion: '2010-09-09'
Description: Tabla DynamoDB de bk (registro de libros leídos, por usuario).

Parameters:
  TableName:
    Type: String
    Default: bk-data
    Description: Nombre de la tabla DynamoDB.

Resources:
  BkTable:
    Type: AWS::DynamoDB::Table
    # Retain: borrar el stack nunca borra el historial.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Ref TableName
      DeletionProtectionEnabled: true
      # Single-table design, igual que wealth:
      #   pk = USER#<email>   sk = BOOK#<id> | TOKEN#<hash>   → libros y tokens del MCP
      #   pk = TOKEN#<hash>   sk = TOKEN   → token → usuario, solo GetItem por hash exacto
      # PAY_PER_REQUEST = coste 0 sin tráfico.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  TableName:
    Description: Nombre de la tabla (ponlo como DYNAMODB_TABLE en Vercel).
    Value: !Ref BkTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
  TableArn:
    Description: ARN de la tabla (para acotar la política IAM).
    Value: !GetAtt BkTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
