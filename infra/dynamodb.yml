AWSTemplateFormatVersion: '2010-09-09'
Description: Tabla DynamoDB y bucket S3 de fotos de bk (registro de libros leídos, por usuario).

Parameters:
  TableName:
    Type: String
    Default: bk-data
    Description: Nombre de la tabla DynamoDB.

Resources:
  BkTable:
    Type: AWS::DynamoDB::Table
    # Retain: borrar el stack nunca borra el historial.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Ref TableName
      DeletionProtectionEnabled: true
      # Single-table design, igual que wealth:
      #   pk = USER#<email>   sk = BOOK#<id> | TOKEN#<hash>   → libros y tokens del MCP
      #   pk = TOKEN#<hash>   sk = TOKEN   → token → usuario, solo GetItem por hash exacto
      # PAY_PER_REQUEST = coste 0 sin tráfico.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Fotos de los libros. Privado: se lee y se sube solo con URLs prefirmadas
  # que genera el servidor para la sesión del usuario.
  BkPhotos:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub '${TableName}-photos-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: limpiar-versiones-antiguas
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # El navegador sube directamente con PUT prefirmado.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ['https://bk.moix.top', 'http://localhost:3000']
            AllowedHeaders: ['*']
            MaxAge: 3600

Outputs:
  TableName:
    Description: Nombre de la tabla (ponlo como DYNAMODB_TABLE en Vercel).
    Value: !Ref BkTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'
  TableArn:
    Description: ARN de la tabla (para acotar la política IAM).
    Value: !GetAtt BkTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'
  PhotosBucket:
    Description: Bucket de fotos (ponlo como S3_BUCKET en Vercel).
    Value: !Ref BkPhotos
    Export:
      Name: !Sub '${AWS::StackName}-PhotosBucket'
  PhotosBucketArn:
    Description: ARN del bucket de fotos.
    Value: !GetAtt BkPhotos.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PhotosBucketArn'
